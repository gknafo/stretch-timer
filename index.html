<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stretch</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon.png">
<style>
  :root { --bg:#0e0f13; --card:#181a21; --fg:#f2f3f7; --dim:#8b90a0; --acc:#7c9cff; --good:#57d99a; }
  * { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:max(12px,env(safe-area-inset-top)) 14px 24px; }
  h1 { font-size:15px; color:var(--dim); font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin:6px 0 10px; }
  .modes { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
  .modes button { background:var(--card); color:var(--dim); border:1px solid #262a35; border-radius:999px;
                  padding:8px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .modes button.on { background:#2b2f3d; color:var(--fg); border-color:var(--acc); }
  .days { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  .days button { background:var(--card); color:var(--dim); border:1px solid #262a35; border-radius:999px;
                 padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .days button.on { background:var(--acc); color:#0b1020; border-color:var(--acc); }
  .stage { width:100%; max-width:520px; background:var(--card); border-radius:22px; padding:26px 18px 20px; text-align:center; }
  .phase { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); min-height:15px; }
  .name  { font-size:clamp(26px,7vw,40px); font-weight:800; line-height:1.15; margin:8px 0 2px; min-height:1.2em; }
  .side  { font-size:17px; color:var(--acc); font-weight:700; min-height:22px; }
  .clock { font-variant-numeric:tabular-nums; font-size:clamp(72px,24vw,132px); font-weight:800; line-height:1; margin:10px 0 6px; }
  .clock.prep { color:var(--good); }
  .next  { color:var(--dim); font-size:15px; min-height:20px; }
  .meta  { color:var(--dim); font-size:13px; margin-top:10px; }
  .ctl { display:flex; gap:10px; justify-content:center; margin-top:18px; }
  .ctl button { background:#232734; color:var(--fg); border:none; border-radius:16px; font-size:22px;
                width:64px; height:56px; cursor:pointer; }
  .ctl button.main { background:var(--acc); color:#0b1020; width:96px; font-weight:800; }
  .opts { margin-top:14px; color:var(--dim); font-size:14px; display:flex; gap:18px; }
  .opts label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .opts { flex-wrap:wrap; justify-content:center; align-items:center; }
  .opts button { background:#232734; color:var(--fg); border:none; border-radius:10px; font-size:13px; padding:5px 12px; cursor:pointer; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; min-height:16px; text-align:center; }
  ol.plan { width:100%; max-width:520px; margin-top:16px; padding:0 6px 0 26px; color:var(--dim); font-size:14px; line-height:1.75; }
  ol.plan { list-style:none; counter-reset:ex; }
  ol.plan li[data-ex] { counter-increment:ex; }
  ol.plan li[data-ex]::before { content:counter(ex) ". "; display:inline-block; min-width:1.8em; margin-left:-1.8em; }
  ol.plan li.now { color:var(--fg); font-weight:700; }
  ol.plan li.rest { font-size:12px; opacity:.7; font-style:italic; }
  ol.plan span { float:right; font-variant-numeric:tabular-nums; }
  .sect { color:var(--acc); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:14px 0 2px; list-style:none; margin-left:-20px; }
</style>
</head>
<body>
<h1>Daily Stretch</h1>
<div class="modes" id="modes"></div>
<div class="days" id="days"></div>
<div class="stage">
  <div class="phase" id="phase"></div>
  <div class="name" id="name">Ready</div>
  <div class="side" id="side"></div>
  <div class="clock" id="clock">0:00</div>
  <div class="next" id="next"></div>
  <div class="meta" id="meta"></div>
  <div class="ctl">
    <button id="back" title="Back">⏮</button>
    <button id="play" class="main" title="Start">▶</button>
    <button id="skip" title="Skip">⏭</button>
    <button id="restart" title="Restart">↺</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="voice" checked> Voice</label>
    <label><input type="checkbox" id="beep" checked> Beeps</label>
    <label><input type="checkbox" id="duck" checked> Pause music</label>
    <button id="test" title="Play a test cue">Test</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<ol class="plan" id="plan"></ol>

<script>
/* ---------- EDIT TIMES/EXERCISES HERE (t = seconds; sides:true = done right then left) ---------- */
const PREP = 7;   // get-into-position seconds before each new exercise
const SWITCH = 5; // reposition seconds between right and left side (not counted in the hold; 0 = none)

const BASE = [ // EVERY DAY, in order
  {n:"Single Leg Forward Fold", t:120, sides:true},
  {n:"Cross Shin Forward Fold", t:90,  sides:true},
  {n:"Child's Pose",            t:180},
  {n:"Puppy Dog",               t:90},
  {n:"Child's Pose Lat Stretch",t:90,  sides:true},
  {n:"Seal",                    t:60},
  {n:"90/90",                   t:120, sides:true},
  {n:"Seiza",                   t:120},
];

const WEEKLY = { // each ★ item once per week; day's additions come BEFORE the every-day block
  1:{label:"Shoulders I", items:[{n:"Doorway Shoulder Flexion",t:90},{n:"Banded Bully",t:90,sides:true},{n:"Banded Tricep",t:90,sides:true},{n:"Shoulder Dislocates",t:120}]},
  2:{label:"Thoracic",    items:[{n:"Cat Cow",t:120},{n:"Twisted Cross",t:90,sides:true},{n:"Saddle Thoracic Twist (PVC)",t:90,sides:true}]},
  3:{label:"Hamstrings + Spine", items:[{n:"Jefferson Curl",t:90},{n:"Supine Hamstring PNF",t:90,sides:true},{n:"Standing Straddle Forward Fold",t:90}]},
  4:{label:"Shoulders II + Wrists", items:[{n:"Double Flat Needle",t:90},{n:"Puppy on Bench",t:90},{n:"Saddle Archer",t:90,sides:true},
      {n:"Wrist Flexor Stretch",t:30},{n:"Reverse Wrist Stretch",t:30},{n:"Wrist Leans",t:30},{n:"Finger & Palm Lifts",t:30}]},
  5:{label:"Hips + Groin",items:[{n:"Dragon",t:90,sides:true},{n:"Figure 4 Single Leg Squats",t:45,sides:true},{n:"Butterfly Forward Fold",t:90},{n:"Sumo Squat w/ Shoulder Twist",t:45,sides:true}]},
  6:{label:"Spine + Core",items:[{n:"Book Opener",t:90,sides:true},{n:"Scorpion",t:60,sides:true},{n:"RDL Hugged-Arms Twist",t:60},{n:"PVC Oblique Isometrics",t:45,sides:true}]},
  0:{label:"Ankles + Neck + PVC", items:[{n:"Classic Dorsiflexion",t:60,sides:true},{n:"Down Dog",t:60},
      {n:"Front Rack (PVC)",t:30,sides:true},{n:"External Rotation (PVC)",t:30,sides:true},{n:"Internal Rotation (PVC)",t:30,sides:true},{n:"Neck Side-to-Side Isometrics",t:120}]},
};

// ===== 2x / WEEK MODE: longer every-day holds + the whole week's extras split into 2 sessions =====
const BASE2 = [ // EVERY DAY (long holds) — used only in 2x/week mode
  {n:"Single Leg Forward Fold", t:180, sides:true},
  {n:"Cross Shin Forward Fold", t:90,  sides:true},
  {n:"Child's Pose",            t:300}, // lat stretch folded in
  {n:"Puppy Dog",               t:60},
  {n:"Seal",                    t:90},
  {n:"90/90",                   t:120, sides:true},
];
const SPLIT = { // every non-every-day exercise, spread across two ~equal sessions
  A:{label:"Upper Body", items:[
    {n:"Doorway Shoulder Flexion",t:90,sides:true},{n:"Doorway Pec Stretch",t:90,sides:true},{n:"Banded Bully",t:90,sides:true},{n:"Banded Tricep",t:90,sides:true},{n:"Shoulder Dislocates",t:60},
    {n:"Foam Roller Thoracic Extension",t:120},{n:"Cat Cow",t:90},{n:"Twisted Cross",t:90,sides:true},{n:"Saddle Thoracic Twist (PVC)",t:150},
    {n:"Double Flat Needle",t:90,sides:true},{n:"Puppy on Bench",t:60},{n:"Saddle Archer",t:90,sides:true},{n:"Book Opener",t:90,sides:true},
    {n:"Chin Tucks",t:60}]},
  B:{label:"Lower, Core & Extremities", items:[
    {n:"Jefferson Curl",t:90},{n:"Supine Hamstring PNF",t:60,sides:true},{n:"Standing Straddle Forward Fold",t:90},
    {n:"Dragon",t:90,sides:true},{n:"Figure 4 Single Leg Squats",t:45,sides:true},{n:"Butterfly Forward Fold",t:90},{n:"Sumo Squat w/ Shoulder Twist",t:60},
    {n:"Scorpion",t:60,sides:true},{n:"RDL Hugged-Arms Twist",t:60},{n:"PVC Oblique Isometrics",t:45,sides:true},
    {n:"Classic Dorsiflexion",t:60,sides:true},{n:"Down Dog",t:60},
    {n:"Front Rack (PVC)",t:30,sides:true},{n:"External Rotation (PVC)",t:30,sides:true},{n:"Internal Rotation (PVC)",t:60,sides:true},
    {n:"Wrist Stretches",t:120},
    {n:"Neck Side-to-Side Isometrics",t:120},{n:"Seiza",t:120}]},
};

// ===== ATG and ABS TABS: no prep countdown. {rest:true,t} = a rest block (or R(t)). =====
const R=t=>({rest:true,t});
const ATG = { // knees over toes; "core" chip = core only, "extra" chip = core + step-ups
  core:[
    {n:"Backwards Walking",t:300},{n:"Tib Raise",t:60,sides:true},{n:"Straight Leg Calf Raise",t:60,sides:true},
    {n:"KOT Calf Raise",t:60,sides:true},{n:"Patrick Step",t:60,sides:true},{n:"Elephant Walk",t:60,sides:true},
    {n:"Couch Stretch",t:60,sides:true}],
  extra:[{n:"Reverse Step Up",t:60,sides:true},{n:"Petersen Step Up",t:60,sides:true}],
};
// rounds of moves, on/off seconds each; a round's last move skips its short rest; roundRest goes between rounds
const circuit=(moves,on,off,rounds,roundRest)=>{ const out=[];
  for(let r=0;r<rounds;r++){ if(r) out.push(R(roundRest));
    moves.forEach((n,i)=>{ out.push({n,t:on}); if(i<moves.length-1) out.push(R(off)); }); }
  return out; };
const ABS = { // AthleanX 7-minute ab routines
  A:[{n:"Figure 8",t:60},{n:"Straight-Leg Windshield Wipers",t:60},{n:"Twisting Pistons",t:60},R(30),{n:"Starfish Crunch",t:30},
     {n:"Same-Side Tuck Planks",t:60},{n:"Upper Circle Crunches (clockwise)",t:60},{n:"Upper Circle Crunches (counterclockwise)",t:60}],
  B:[{n:"Ab Circles",t:60},{n:"Ab Circles (reverse)",t:60},{n:"Drunken Mountain Climbers",t:60},R(30),
     {n:"Marching Plank",t:60},{n:"Scissors",t:60},{n:"Starfish Crunch",t:30},R(30),{n:"Russian V-Tuck Twists",t:30}],
  C:circuit(["Figure 8","Lower Ab Swipes","Bicycle V-Ups","Heaven Press","3-Way Seated Ab Tucks","Knees-to-Elbow Crunches"],20,10,2,60),
  D:[{n:"Reverse Frog Swipes",t:60},R(30),{n:"Hip Drop Knee Drives",t:60},R(30),{n:"V-Up Leg Hugs",t:60},R(30),
     {n:"Sledgehammers",t:60},R(30),{n:"Roll-Ups",t:60}],
};
/* ----------------------------------------------------------------------------------------------- */

const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
// Modes hidden from the picker (code kept). To bring one back, delete it from this list (old default was mode="daily").
const HIDDEN_MODES = ["daily","full"];
let mode="split", day=(new Date()).getDay(), segs=[], idx=-1, running=false, segStart=0, remaining=0, raf=null, wakeLock=null;
let pick={split:"A", atg:"core", abs:"A"}; // selected chip per tab
// A plan is groups of items run in order; prep/sw are the get-ready and side-switch seconds for that tab.
const G=(items,head,phase)=>({items,head,phase});
function plan(){
  const EV=G(BASE2,"Every Day · long holds","every day"), str={prep:PREP,sw:SWITCH,unit:"timed holds"};
  if(mode==="daily") return {...str, phase:WEEKLY[day].label+" + every day", tag:DAYNAMES[day],
    groups:[G(WEEKLY[day].items,"Today: "+WEEKLY[day].label,"today's focus"), G(BASE,"Every Day","every day")]};
  if(mode==="full") return {...str, phase:"Full Routine + every day (long holds)", tag:"Full routine",
    groups:[G(SPLIT.A.items,"Part 1 · "+SPLIT.A.label,"today's focus"), G(SPLIT.B.items,"Part 2 · "+SPLIT.B.label,"today's focus"), EV]};
  if(mode==="atg"){ const x=pick.atg==="extra";
    return {prep:0, sw:SWITCH, unit:"timed sets", phase:"Knees over toes"+(x?" + step-ups":""), tag:x?"ATG + step-ups":"ATG",
      groups:[G(ATG.core,"ATG · Knees over toes","knees over toes")].concat(x?[G(ATG.extra,"Step-ups","knees over toes")]:[])}; }
  if(mode==="abs") return {prep:0, sw:SWITCH, unit:"timed sets", phase:"7-minute abs · routine "+pick.abs, tag:"Abs "+pick.abs,
    groups:[G(ABS[pick.abs],"Abs "+pick.abs+" · AthleanX 7 min","abs")]};
  const k=pick.split; return {...str, phase:SPLIT[k].label+" + every day (long holds)", tag:"Session "+k,
    groups:[G(SPLIT[k].items,"Session "+k+" · "+SPLIT[k].label,"today's focus"), EV]}; }

const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
// Audio cues (beep and/or voice). iOS facts this relies on (WebKit bugs 252746, 264473):
//  - Web Audio defaults to the "Ambient" category: it mixes with music, but the ring/silent switch mutes it.
//  - audioSession "ambient", "transient" and "transient-solo" all map to Ambient as well (muted on silent).
//  - Only "playback" ignores the silent switch; it is exclusive, so it pauses other audio.
// Pause music ON: each cue takes the session as "playback", then the context is suspended so the session
// goes idle and the paused music can resume. OFF: "ambient", which plays over music; the silent switch mutes it.
let actx=null, cueN=0, cueOff=null, curU=null;
const AC=window.AudioContext||window.webkitAudioContext;
const ducking=()=>$("duck").checked;
function setSession(t){ try{ if(navigator.audioSession&&navigator.audioSession.type!==t) navigator.audioSession.type=t; }catch(e){} }
function ctx(){ if(!actx&&AC) actx=new AC(); return actx; }
function unlock(){ // call inside a tap so later cues can play from timers on iOS
  setSession(ducking()?"playback":"ambient");
  const c=ctx(); if(!c) return;
  if(c.state!=="running") c.resume().catch(()=>{});
  try{ const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0); }catch(e){} }
function cueOn(){ clearTimeout(cueOff); setSession(ducking()?"playback":"ambient");
  const c=ctx(); if(c&&c.state!=="running") c.resume().catch(()=>{}); return ++cueN; }
function cueDone(k,ms){ if(k!==cueN) return; clearTimeout(cueOff);
  cueOff=setTimeout(()=>{ if(k!==cueN) return;
    if(window.speechSynthesis&&speechSynthesis.speaking) return cueDone(k,500); // still talking: check again
    if(ducking()&&actx&&actx.state==="running") actx.suspend().catch(()=>{});  // release so music resumes
  },ms); }
const say=(t,k)=>{ if(!$("voice").checked||!window.speechSynthesis) return false;
  const u=new SpeechSynthesisUtterance(t); u.rate=1.0;
  u.onend=u.onerror=()=>{ if(curU===u) curU=null; cueDone(k,300); };
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); // cancel-then-speak can drop the new line
  curU=u; cueDone(k,2000+t.length*90); speechSynthesis.speak(u); return true; };
function cue(text,f,d=0.12,n=1){ const k=cueOn(); if(f) beep(f,d,n);
  if(!(text&&say(text,k))) cueDone(k,f?n*200+400:300); }
const dur=t=>{const m=Math.floor(t/60),s=t%60;let out=m?`${m} minute${m>1?"s":""}`:"";if(s)out+=(out?" ":"")+`${s} seconds`;return out;};
function beep(f=880,d=0.12,n=1){ if(!$("beep").checked) return;
  const actx=ctx(); if(!actx) return;
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);
    const t0=actx.currentTime+i*0.2;g.gain.setValueAtTime(0.25,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);o.start(t0);o.stop(t0+d);} }

function build(){
  const p=plan(); segs=[]; let ii=0;
  p.groups.forEach(g=>g.items.forEach(ex=>{ const i=ii++, phase=g.phase;
    if(ex.rest){ segs.push({n:"Rest",rest:true,t:ex.t,i,phase:"rest"}); return; }
    if(p.prep>0) segs.push({prep:true,n:ex.n,t:p.prep,i,phase});
    if(ex.sides){ segs.push({n:ex.n,side:"Right side",t:ex.t,i,phase,first:true});
                  if(p.sw>0) segs.push({n:ex.n,side:"Switch to left side",t:p.sw,i,phase,prep:true,swap:true});
                  segs.push({n:ex.n,side:"Left side",t:ex.t,i,phase,second:true,sw:p.sw}); }
    else segs.push({n:ex.n,t:ex.t,i,phase,first:true}); }));
  idx=-1; running=false; remaining=0; cancelAnimationFrame(raf);
  renderPlan(); renderIdle();
}
const total=()=>segs.reduce((a,s)=>a+s.t,0);
const work=s=>!s.prep&&!s.rest; // a timed hold or set
const nextWork=i=>segs.slice(i+1).find(work);

function renderPlan(){
  const p=plan(); let h="", ii=0;
  p.groups.forEach(g=>{ h+=`<li class="sect">${g.head}</li>`; g.items.forEach(e=>{ const i=ii++;
    h+=e.rest?`<li class="rest" data-i="${i}">Rest<span>${fmt(e.t)}</span></li>`
      :`<li data-ex="${e.n}" data-i="${i}">${e.n}${e.sides?" (per side)":""}<span>${fmt(e.t)}${e.sides?"/side":""}</span></li>`; }); });
  $("plan").innerHTML=h;
}
function highlight(){ const cur=idx>=0&&idx<segs.length?String(segs[idx].i):null;
  document.querySelectorAll("#plan li[data-i]").forEach(li=>li.classList.toggle("now",li.dataset.i===cur)); }

function renderIdle(){ const p=plan(); $("phase").textContent=p.phase;
  $("name").textContent="Ready"; $("side").textContent=""; $("clock").textContent=fmt(total());
  $("clock").classList.remove("prep"); $("next").textContent="First: "+nextWork(-1).n;
  $("meta").textContent=`${p.tag} · ${segs.filter(work).length} ${p.unit} · ${fmt(total())} total`;
  $("play").textContent="▶"; highlight(); }

function show(){ const s=segs[idx];
  $("phase").textContent=s.swap?"switch sides":s.prep?"get ready":s.phase;
  $("name").textContent=s.n; $("side").textContent=s.side||"";
  $("clock").classList.toggle("prep",!!(s.prep||s.rest));
  const nxt=nextWork(idx);
  $("next").textContent=nxt?("Next: "+nxt.n+(nxt.side?" — "+nxt.side.toLowerCase():"")):"Last one";
  const done=segs.slice(0,idx).reduce((a,x)=>a+x.t,0);
  $("meta").textContent="Session remaining ~"+fmt(total()-done-(s.t-remaining));
  highlight(); }

function announce(s){
  if(s.rest){ const nx=nextWork(idx); cue(nx?"Rest. Next: "+nx.n+".":"Rest.",660); }
  else if(s.swap) cue("Switch sides.",660);                              // reposition gap, not part of the hold
  else if(s.prep) cue("Next: "+s.n);
  else if(s.second) cue(s.sw===0?"Switch sides.":"",s.sw>0?880:660);    // left hold starts: beep only
  else if(s.first&&s.side) cue(s.n+", right side. "+dur(s.t)+".",880);
  else cue(s.n+". "+dur(s.t)+".",880); }

function start(i){ idx=i; const s=segs[idx]; remaining=s.t; segStart=performance.now(); announce(s); show(); }
function advance(){ if(idx>=segs.length-1){ finish(); return; } start(idx+1); }
function finish(){ running=false; cancelAnimationFrame(raf); cue("Done.",1040,0.15,3);
  $("phase").textContent=""; $("name").textContent="Done ✦"; $("side").textContent="";
  $("clock").textContent="0:00"; $("next").textContent=""; $("play").textContent="▶"; idx=-1; releaseWake(); }

function tick(){ if(!running) return;
  const s=segs[idx], el=(performance.now()-segStart)/1000; remaining=s.t-el;
  if(remaining<=0){ advance(); } else { $("clock").textContent=fmt(remaining); show(); }
  raf=requestAnimationFrame(tick); }

async function grabWake(){ try{ wakeLock=await navigator.wakeLock?.request("screen"); }catch(e){} }
function releaseWake(){ try{ wakeLock?.release(); wakeLock=null; }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&running) grabWake(); });

$("play").onclick=()=>{ if(running){ running=false; cancelAnimationFrame(raf); $("play").textContent="▶"; }
  else { unlock(); if(idx<0) start(0); else segStart=performance.now()-(segs[idx].t-remaining)*1000;
    running=true; $("play").textContent="⏸"; grabWake(); raf=requestAnimationFrame(tick); } };
$("skip").onclick=()=>{ if(idx<0) return; advance(); };
$("back").onclick=()=>{ if(idx<=0) return; let i=idx-1; while(i>0&&segs[i].prep) i--; start(i); };
$("restart").onclick=()=>{ build(); };

const dd=$("days"), mm=$("modes");
const CHIPS={split:[["A","Session A"],["B","Session B"]], atg:[["core","Core"],["extra","+ Step-ups"]], abs:[["A","A"],["B","B"],["C","C"],["D","D"]]};
function renderChips(){ dd.innerHTML="";
  const mk=(txt,on,fn)=>{ const b=document.createElement("button"); b.textContent=txt; if(on)b.classList.add("on"); b.onclick=fn; dd.appendChild(b); };
  if(mode==="daily") [1,2,3,4,5,6,0].forEach(d=>mk(DAYNAMES[d], d===day, ()=>{ day=d; renderChips(); build(); }));
  else if(CHIPS[mode]) CHIPS[mode].forEach(([k,lab])=>mk(lab, k===pick[mode], ()=>{ pick[mode]=k; renderChips(); build(); }));
  // full mode: no chips — one session covers everything
}
[["daily","Daily"],["split","2× / Week"],["full","1× / Week"],["atg","ATG"],["abs","Abs"]].filter(([k])=>!HIDDEN_MODES.includes(k)).forEach(([k,lab])=>{ const b=document.createElement("button");
  b.textContent=lab; if(k===mode)b.classList.add("on");
  b.onclick=()=>{ mode=k; [...mm.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); renderChips(); build(); };
  mm.appendChild(b); });
renderChips(); build();
$("test").onclick=()=>{ unlock(); cue($("voice").checked?"Test.":"",880); };
const hint=()=>{ $("hint").textContent=ducking()?"Cues pause your music and play even on silent."
  :"Cues play over your music; the silent switch mutes them."; };
["voice","beep","duck"].forEach(id=>$(id).addEventListener("change",()=>{ unlock(); hint(); }));
hint();
